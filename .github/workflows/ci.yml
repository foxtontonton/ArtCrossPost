name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest numpy opencv-python-headless Pillow

      - name: Run Ruff Lint Checks
        run: |
          ruff check .

      - name: Syntax & Compilation Validation
        run: |
          python -m py_compile app.py config.py censor_engine.py watermark_engine.py diagnostics.py logger.py x_text_utils.py make_release_zip.py
          python -m py_compile dispatchers/base.py dispatchers/deviantart.py dispatchers/monetization.py dispatchers/x_twitter.py dispatchers/__init__.py

      - name: Run Unit Tests
        run: |
          pytest tests/ -v
